services:
  millionws:
    image: meanii/millionws
    build:
      context: ../..
      dockerfile: Dockerfile
    # 16 ports: one client IP holds ~64k connections per server port.
    command: ["-ports=8081-8095", "-keepalive=0s"]
    ulimits:
      nofile:
        soft: 2097152
        hard: 2097152
    ports:
      - "8002-8017:8080-8095"
    restart: always

  grafana:
    image: grafana/grafana
    # Bound to localhost: reach Grafana through an SSH tunnel
    # (ssh -L 8001:localhost:8001 root@<host>). The default admin/admin
    # credentials must never sit on a public port.
    ports:
      - "127.0.0.1:8001:3000"
    restart: always
    environment:
      # Image renderer settings
      GF_RENDERING_SERVER_URL: "http://grafana-image-renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"

      GF_SERVER_ROOT_URL: "http://localhost:8001"

      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_SECURITY_ADMIN_USER: "admin"
    volumes:
      - "grafana_data:/var/lib/grafana"
      - "../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources" # mounting for automatically provisioning datasources
      - "../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards" # mounting for automatically provisioning dashboards
    depends_on:
      - prometheus

  grafana-image-renderer:
    image: grafana/grafana-image-renderer:latest
    restart: always
    ports:
      - "8081:8081"
    environment:
      ENABLE_METRICS: "true"
    depends_on:
      - prometheus
      - grafana

  prometheus:
    image: prom/prometheus
    # Same as Grafana above: localhost only, use the SSH tunnel.
    # --web.enable-lifecycle below allows remote shutdown/restart,
    # which is safe only behind this bind.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - "../grafana/provisioning/datasources/prometheus.yml:/etc/prometheus/prometheus.yml"
      - "prometheus_data:/prometheus"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"

volumes:
  grafana_data:
  prometheus_data:
