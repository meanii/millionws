# Server side of the EC2 benchmark stack. Started by cloud-init
# (infra/opentofu/aws-ec2/user_data_server.sh), which clones this repo,
# writes prometheus.yml with the client targets, and runs
# `docker compose up -d --build` here.
services:
  server:
    image: millionws:server
    build:
      context: ../..
      dockerfile: Dockerfile
    # 16 ports by default. -ports adds to -port (default 8080); the server
    # drops the repeat, so 8080-8095 is safe. Keepalive-off
    # is the measured best (see results/local/2026-09-29-optimization.md).
    # SERVER_PORTS is substituted by cloud-init from Terraform vars.
    command: ["-ports=${SERVER_PORTS:-8080-8095}", "-keepalive=0s"]
    # Host networking: with bridge + published ports every connection would
    # also take a Docker NAT conntrack entry, and 1M of them run into
    # nf_conntrack_max. The host's sysctls (cloud-init) apply directly.
    network_mode: host
    cpus: 2
    mem_limit: 8g
    memswap_limit: 8g
    ulimits:
      nofile:
        soft: 2097152
        hard: 2097152
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # The server is on the host network; reach it through the host gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ../grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
