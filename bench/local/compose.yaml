# Local benchmark stack. Started by bench/local/run.sh, which sets the
# variables below from bench/local/variants/<name>.env.
#
# The server container is capped (1 CPU and 1 GiB by default, no swap). The
# load generators are not capped so they are never the bottleneck.

name: millionws-bench

services:
  server:
    image: ${SERVER_IMAGE:?set by run.sh}
    hostname: server
    cpus: ${SERVER_CPUS:-1}
    mem_limit: ${SERVER_MEM:-1g}
    memswap_limit: ${SERVER_MEM:-1g}
    restart: "no"
    environment:
      GOMEMLIMIT: ${SERVER_GOMEMLIMIT:-}
      GOGC: ${SERVER_GOGC:-}
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    sysctls:
      net.core.somaxconn: 65535
      net.ipv4.tcp_max_syn_backlog: 65535
    ports:
      - "127.0.0.1:18080:8080"

  loadgen:
    image: millionws-bench:loadgen
    build:
      context: ../..
      target: loadgen
    restart: "no"
    environment:
      LOADGEN_URL: ws://server:8080${SERVER_PATH:-/ws}
      LOADGEN_CONNS: ${LOADGEN_CONNS:-10000}
      LOADGEN_RATE: ${LOADGEN_RATE:-1000}
      LOADGEN_INTERVAL: ${LOADGEN_INTERVAL:-30s}
      LOADGEN_PAYLOAD: ${LOADGEN_PAYLOAD:-32}
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    sysctls:
      # One source IP can hold one connection per local port to server:8080.
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_tw_reuse: 1
    depends_on:
      - server

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:19090:9090"

  # Shares the Docker host network namespace so record.py can read the
  # conntrack table that container-to-container connections use.
  netwatch:
    image: alpine:3.22
    network_mode: host
    command: ["sleep", "infinity"]
    init: true

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["grafana"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ../../deploy/grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ../../deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "127.0.0.1:18001:3000"
    depends_on:
      - prometheus
